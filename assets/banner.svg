<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none" role="img" aria-label="TossSky — security, blockchain, systems. A horizontal scan beam sweeps a wireframe field beside a hexagonal watchtower mark.">
  <defs>
    <!-- scan beam: bright red core fading at both ends -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FF3B1A" stop-opacity="0"/>
      <stop offset="18%" stop-color="#FF3B1A" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="82%" stop-color="#FF3B1A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF3B1A" stop-opacity="0"/>
    </linearGradient>
    <!-- watchtower stroke: signal-red top, deep ember bottom -->
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF3B1A"/>
      <stop offset="100%" stop-color="#7A1A0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FF3B1A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF3B1A" stop-opacity="0"/>
    </radialGradient>
    <!-- hairline wireframe grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <!-- left vignette so the wordmark stays legible over the grid -->
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="240" fill="#000000"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <rect width="1200" height="240" fill="url(#vignette)"/>

  <!-- frame hairlines -->
  <line x1="0" y1="1"   x2="1200" y2="1"   stroke="#FFFFFF" stroke-opacity="0.10"/>
  <line x1="0" y1="239" x2="1200" y2="239" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- ============ HEX WATCHTOWER (echoes the ETorn logomark) ============ -->
  <g transform="translate(1010,120)">
    <circle cx="0" cy="0" r="120" fill="url(#glow)">
      <animate attributeName="r" values="105;125;105" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <g stroke="url(#tower)" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <!-- hex frame -->
      <path d="M0 -78 L68 -39 L68 39 L0 78 L-68 39 L-68 -39 Z"/>
    </g>
    <!-- battlement merlons (also read as a tower silhouette) -->
    <g fill="url(#tower)">
      <rect x="-34" y="-34" width="14" height="28" rx="2"/>
      <rect x="-7"  y="-34" width="14" height="28" rx="2"/>
      <rect x="20"  y="-34" width="14" height="28" rx="2"/>
      <rect x="-40" y="2"  width="80" height="6" rx="3"/>
      <rect x="-30" y="16" width="60" height="14" rx="2" opacity="0.5"/>
    </g>
    <!-- inspection pulse ring -->
    <path d="M0 -78 L68 -39 L68 39 L0 78 L-68 39 L-68 -39 Z"
          stroke="#FF3B1A" stroke-width="1.5" fill="none" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="4.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============ WORDMARK + MANIFESTO ============ -->
  <text x="64" y="74" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace"
        font-size="14" letter-spacing="6.5" fill="#8A8A8E">SECURITY · BLOCKCHAIN · SYSTEMS</text>

  <text x="61" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="84" font-weight="800" letter-spacing="-3" fill="#FAFAFA">TossSky</text>

  <text x="64" y="190" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace"
        font-size="16" letter-spacing="0.5" fill="#FF3B1A">// I break things before they hold value.</text>

  <!-- severity legend dots, lighting up in sequence -->
  <g transform="translate(66,214)" font-family="ui-monospace, monospace">
    <circle cx="0"   cy="0" r="4" fill="#FF3B1A"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="22"  cy="0" r="4" fill="#FF8A33"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="44"  cy="0" r="4" fill="#F5C13D"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="66"  cy="0" r="4" fill="#5DD3F5"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="88"  cy="0" r="4" fill="#8A8A8E"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ============ SCAN BEAM (sweeps the whole field) ============ -->
  <g>
    <rect x="-3" y="0" width="60" height="240" fill="url(#glow)" opacity="0.5"/>
    <rect x="0"  y="0" width="2.5" height="240" fill="url(#beam)"/>
    <animateTransform attributeName="transform" type="translate"
                      from="-60 0" to="1260 0" dur="4.8s"
                      keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1"
                      repeatCount="indefinite"/>
  </g>
</svg>
